name: Build Vinn FF Panel APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Create project files
        shell: bash
        run: |
          set -e
          mkdir -p "$(dirname 'build.gradle')"
          echo cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNi4xJyBhcHBseSBmYWxzZQp9Cg== | base64 -d > "build.gradle"
          mkdir -p "$(dirname 'settings.gradle')"
          echo  | base64 -d > "settings.gradle"
          mkdir -p "$(dirname 'gradle.properties')"
          echo b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCg== | base64 -d > "gradle.properties"
          mkdir -p "$(dirname 'app/build.gradle')"
          echo  | base64 -d > "app/build.gradle"
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          echo  | base64 -d > "app/src/main/AndroidManifest.xml"
          mkdir -p "$(dirname 'app/src/main/assets/index.html')"
          echo  | base64 -d > "app/src/main/assets/index.html"
          mkdir -p "$(dirname 'app/src/main/java/com/vinn/ffpanel/MainActivity.java')"
          echo  | base64 -d > "app/src/main/java/com/vinn/ffpanel/MainActivity.java"
          mkdir -p "$(dirname 'app/src/main/res/values/styles.xml')"
          echo  | base64 -d > "app/src/main/res/values/styles.xml"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VinnFFPanel-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
